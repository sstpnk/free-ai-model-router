name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "output/latest.json"
      - "data/normalized/endpoints.json"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[litellm]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check --select E,F,I src tests

      - name: Smoke-generate TinyLLM config
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          from free_ai_model_router.config_loader import Settings
          from free_ai_model_router.generation.tinyllm_config import generate_tinyllm_config_file
          from free_ai_model_router.models import ProviderEndpoint, RouterOutput

          base = Path(".")
          router_output = RouterOutput.model_validate_json(
              (base / "output" / "latest.json").read_text(encoding="utf-8")
          )
          endpoints_path = base / "data" / "normalized" / "endpoints.json"
          endpoints = []
          if endpoints_path.exists():
              endpoints = [
                  ProviderEndpoint.model_validate(item)
                  for item in json.loads(endpoints_path.read_text(encoding="utf-8"))
              ]

          target = Path("artifacts") / "tinyllm-router-config.yaml"
          generate_tinyllm_config_file(
              router_output,
              endpoints,
              target,
              providers=Settings.from_base_dir(base).providers.providers,
          )
          generated = yaml.safe_load(target.read_text(encoding="utf-8"))
          assert generated["providers"]["deepseek2api"]["api_key_env"] == "DEEPSEEK2API_API_KEY"
          assert generated["routes"]["coding-auto"], "coding-auto route must not be empty"
          print(f"Wrote {target}")
          print(f"Providers: {', '.join(sorted(generated['providers']))}")
          print(f"coding-auto steps: {len(generated['routes']['coding-auto'])}")
          PY

      - name: Upload generated smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyllm-router-config-smoke
          path: artifacts/tinyllm-router-config.yaml
          if-no-files-found: error
          retention-days: 7
